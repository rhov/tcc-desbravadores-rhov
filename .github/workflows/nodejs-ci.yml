name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Criar .env
      run: |
        echo "BASE_URL_GRAPHQL=${{ secrets.BASE_URL_GRAPHQL }}" >> .env
        echo "BASE_URL_REST=${{ secrets.BASE_URL_REST }}" >> .env

    - name: Subir as APIs GraphQL
      run: npm run start &

    - name: Esperar a API GraphQL estar Funcionando
      run: sleep 8

    - name: Rodar os testes External de API GraphQL via HTTP
      run: npm run test

    - name: Upload report ALL tests Graphql
      uses: actions/upload-artifact@v4
      with:
        name: mochawesome-report ALL tests Graphql
        path: mochawesome-report/

    - name: Teste de Performance k6 (criarClube)
      uses: grafana/k6-action@v0.3.1
      with:
        filename: test/k6/rest/criarClube.test.js
        flags: --network host  # Isso permite que o k6 veja o localhost:3000
      env:
        BASE_URL_REST: ${{ secrets.BASE_URL_REST }}